<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My GitHub Gists</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      margin: 0;
      padding: 2rem;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }
    p {
      color: #9ca3af;
    }
    .input-row {
      margin: 1.5rem 0;
      display: flex;
      gap: 0.5rem;
    }
    input {
      flex: 1;
      padding: 0.6rem 0.75rem;
      border-radius: 0.5rem;
      border: none;
      outline: none;
      font-size: 1rem;
    }
    button {
      padding: 0.6rem 1rem;
      border-radius: 0.5rem;
      border: none;
      background: #3b82f6;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover {
      background: #2563eb;
    }
    ul {
      list-style: none;
      padding: 0;
      margin-top: 2rem;
    }
    li {
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 0.75rem;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    a {
      color: #60a5fa;
      text-decoration: none;
      font-weight: 500;
    }
    a:hover {
      text-decoration: underline;
    }
    .meta {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 0.25rem;
    }
    .error {
      color: #f87171;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <h1>GitHub Gist Explorer</h1>
  <p>Listing all public gists for <strong>@viruspilot</strong>.</p>

  

  <div id="status"></div>
  <ul id="gistList"></ul>

  <script>
    const DEFAULT_USERNAME = 'viruspilot';
    async function loadGists() {
      const username = DEFAULT_USERNAME;
      const list = document.getElementById('gistList');
      const status = document.getElementById('status');

      list.innerHTML = '';
      status.textContent = '';

      if (!username) {
        status.innerHTML = '<div class="error">Please enter a GitHub username.</div>';
        return;
      }

      status.textContent = 'Loading gists…';

      try {
        const response = await fetch(`https://api.github.com/users/${username}/gists`);
        if (!response.ok) throw new Error('User not found or API error');

        const gists = await response.json();
        status.textContent = '';

        if (gists.length === 0) {
          status.textContent = 'No public gists found.';
          return;
        }

        gists.forEach(gist => {
          const li = document.createElement('li');
          const title = gist.description || 'Untitled Gist';
          const fileCount = Object.keys(gist.files).length;

          li.innerHTML = `
            <a href="${gist.html_url}" target="_blank">${title}</a>
            <div class="meta">${fileCount} file(s) • Updated ${new Date(gist.updated_at).toLocaleDateString()}</div>
          `;
          list.appendChild(li);
        });
      } catch (err) {
        status.innerHTML = '<div class="error">Failed to load gists. Check the username and try again.</div>';
      }
    }
      window.addEventListener('DOMContentLoaded', loadGists);
  </script>
</body>
</html>
